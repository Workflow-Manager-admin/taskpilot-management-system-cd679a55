<div class="auth-container">
  <h2>Register</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" formControlName="username" type="text" required />
      <div class="error" *ngIf="registerForm.controls.username.touched && registerForm.controls.username.invalid">
        Username is required.
      </div>
    </div>
    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" required />
      <div class="error" *ngIf="registerForm.controls.email.touched && registerForm.controls.email.invalid">
        Valid email is required.
      </div>
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" required minlength="6" />
      <div class="error" *ngIf="registerForm.controls.password.touched && registerForm.controls.password.invalid">
        Password must be at least 6 characters.
      </div>
    </div>
    <button type="submit" [disabled]="loading">Register</button>
    <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="success" *ngIf="successMsg">{{ successMsg }}</div>
    <div class="loader" *ngIf="loading">Registering...</div>
    <p>Already have an account? <a routerLink="../login">Login</a></p>
  </form>
</div>
