<div class="auth-container">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" formControlName="username" type="text" required />
      <div class="error" *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">
        Username is required.
      </div>
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" required />
      <div class="error" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
        Password is required.
      </div>
    </div>
    <button type="submit" [disabled]="loading">Login</button>
    <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="loader" *ngIf="loading">Logging in...</div>
    <p>Don't have an account? <a routerLink="../register">Register</a></p>
  </form>
</div>
